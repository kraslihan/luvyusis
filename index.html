<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Together — Sağlık Takibi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f1e6;
    --surface:#ffffff;
    --surface-2:#eee6d4;
    --ink:#2c2a22;
    --ink-dim:#847c6c;
    --accent:#7fa887;
    --accent-strong:#4f7358;
    --accent-soft:#e4ede2;
    --gold:#e0a857;
    --gold-soft:#f8ecd6;
    --bad:#d98a76;
    --bad-soft:#f8e3dd;
    --border:rgba(44,42,34,0.10);
    --shadow:0 1px 2px rgba(44,42,34,0.05), 0 10px 26px -14px rgba(44,42,34,0.22);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
    /* ---- future-proofing aliases: same underlying values, new names ----
       CSS custom properties resolve at used-value time, so when a
       [data-theme] block below overrides --accent/--bad/etc, everything
       that references --primary/--danger/etc automatically follows,
       without needing to redefine these aliases per theme. */
    --surface-soft:var(--surface-2);
    --text:var(--ink);
    --text-muted:var(--ink-dim);
    --primary:var(--accent);
    --primary-hover:var(--accent-strong);
    --primary-soft:var(--accent-soft);
    --input-bg:var(--surface-2);
    --danger:var(--bad);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  /* Lock the OUTER page so it can never scroll as a whole — iOS Safari's
     100vh includes the area behind its retracting address bar, which used
     to make the whole document taller than the visible screen and let the
     browser scroll the header/nav out of view. Only #view-container (the
     middle content area) is allowed to scroll; html/body never do. */
  html{overflow:hidden;}
  body{
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .num{font-family:'Space Mono','Courier New',monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;}

  /* ---------- app shell / phone frame on wide screens ---------- */
  #app-shell{
    max-width:460px;
    margin:0 auto;
    /* 100vh first as a safe fallback for very old browsers, then 100dvh
       (dynamic viewport height) which correctly excludes the iOS Safari
       address bar / home indicator chrome — modern rule wins when supported. */
    height:100vh;
    height:100dvh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media (min-width:520px){
    html,body{overflow:auto;height:auto;}
    html{overflow-y:scroll;scrollbar-gutter:stable;}
    body{ background:#e9e3d3; display:flex; justify-content:center; overscroll-behavior:auto; }
    #app-shell{
      margin:20px auto;
      height:calc(100vh - 40px);
      height:calc(100dvh - 40px);
      border-radius:32px;
      box-shadow:0 30px 60px -30px rgba(44,42,34,0.35), 0 0 0 1px rgba(44,42,34,0.06);
    }
  }

  /* --- Mobile app shell: 3 fixed flex regions, exactly one scrolls ---
     #app-shell is a column flexbox pinned to the true visual viewport
     (100dvh). #top-bar-holder and #bottom-nav-holder are flex:none, so
     their height is whatever their content needs and they NEVER move.
     #view-container is the only flex:1 child, so it alone absorbs all
     remaining space and is the only element that scrolls. This one
     mechanism is shared by every page — pages only ever render into
     #view-container, never into the header or nav regions. */
  #top-bar-holder{
    flex:none;
    padding:calc(6px + env(safe-area-inset-top)) 18px 6px;
    background:var(--bg);
    position:relative;
    z-index:5;
    border-bottom:1px solid transparent; /* reserves a hairline without shifting layout when content changes */
    min-width:0;
  }
  #view-container{
    flex:1 1 auto;
    min-height:0;
    min-width:0;
    padding:12px 18px 16px;
    overflow-y:auto;
    overflow-x:hidden; /* defensive backstop only — real overflow sources below are fixed at the source */
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  /* Grid/flex children default to min-width:auto, which lets a wide native
     control (date picker, tabular numbers) push its column past 1fr and
     force the whole page to feel horizontally scrollable. Force them to
     shrink to their column instead of overflowing it. This is the actual
     fix (not just the overflow-x:hidden backstop above) — every flex/grid
     container in this file that can hold a wide child gets min-width:0 on
     its children, and every card/input caps at max-width:100%. */
  .grid-2 > *, .grid-3 > *, .weight-input-row > *, .row > *, .stack > *,
  .theme-grid > *, .streak-row > *{ min-width:0; }
  .field, .field *{ max-width:100%; }
  .card, .list-item, .sticky-note, .song-card, .mini-stat, .streak-card, .stat-line{ max-width:100%; }
  #bottom-nav-holder{flex:none;min-width:0;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;min-width:0;}
  .top-bar > div{min-width:0;}
  .top-bar h1{font-size:18px;font-weight:800;margin:0;line-height:1.2;}
  .top-bar .sub{font-size:12px;color:var(--ink-dim);line-height:1.3;margin-top:1px;}
  .back-header{background:none;border:none;color:var(--text-muted);font-weight:800;font-size:12.5px;padding:2px 0 3px;margin:0;min-height:28px;}
  .back-header:active{color:var(--primary);}

  /* ---------- top bar ---------- */
  .user-toggle{
    display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex:none;
  }
  .user-toggle button{
    border:none;background:transparent;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-dim);
  }
  .user-toggle button.active{background:var(--accent);color:#fff;}

  /* ---------- generic cards / layout ---------- */
  .card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:15px 16px;margin-bottom:11px;width:100%;}
  .card.tight{padding:12px 14px;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-dim);font-weight:800;margin:0 0 12px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;}
  .stack{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

  .btn{
    border:none;border-radius:var(--radius-md);padding:14px 18px;font-weight:800;font-size:15px;
    min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:active{background:var(--accent-strong);}
  .btn-soft{background:var(--accent-soft);color:var(--accent-strong);}
  .btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--ink-dim);font-weight:700;padding:8px 10px;min-height:auto;width:auto;}
  .btn-sm{padding:9px 14px;font-size:13.5px;min-height:38px;width:auto;}
  .btn-danger-ghost{background:transparent;color:var(--bad);font-weight:700;min-height:auto;padding:6px 8px;width:auto;}

  .field{margin-bottom:11px;min-width:0;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;}
  .field input[type=number], .field input[type=date], .field input[type=text], .field input[type=time], .field textarea, .field select{
    width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
    background:var(--input-bg);color:var(--text);font-size:15px;min-height:46px;max-width:100%;
  }
  .field textarea{resize:vertical;min-height:64px;font-family:inherit;}
  .field input:focus, .field textarea:focus, .field select:focus, button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;}
  .pill-good{background:var(--accent-soft);color:var(--accent-strong);}
  .pill-warn{background:var(--gold-soft);color:#8a6420;}
  .pill-bad{background:var(--bad-soft);color:#a3453a;}
  .pill-neutral{background:var(--surface-2);color:var(--ink-dim);}

  .empty-state{
    text-align:center;color:var(--ink-dim);font-size:13px;padding:14px 10px;
    background:var(--surface-2);border-radius:var(--radius-md);
  }

  /* compact single-line stat row for Bugün */
  .stat-line{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface);border-radius:var(--radius-md);padding:11px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:800;margin-bottom:12px;flex-wrap:wrap;}
  .stat-line span{white-space:nowrap;}

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:sticky;bottom:0;left:0;right:0;
    background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:20;
    min-width:0;
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;color:var(--ink-dim);padding:7px 2px;border-radius:14px;min-height:44px;min-width:0;
  }
  .nav-item .ico{line-height:1;display:flex;align-items:center;justify-content:center;}
  .nav-item .ico svg{display:block;width:20px;height:20px;}
  .nav-item .lbl{font-size:10.5px;font-weight:700;white-space:nowrap;}
  .nav-item.active{color:var(--primary-hover);background:var(--primary-soft);font-weight:800;}
  .nav-item.active .ico{transform:scale(1.06);}

  /* ---------- streak / mini stat ---------- */
  .streak-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .streak-card{background:linear-gradient(160deg,var(--gold-soft),var(--surface));border-radius:var(--radius-lg);padding:16px;text-align:center;box-shadow:var(--shadow);}
  .streak-card .n{font-size:30px;font-weight:800;color:var(--gold);}
  .streak-card.together{background:linear-gradient(160deg,var(--accent-soft),var(--surface));}
  .streak-card.together .n{color:var(--accent-strong);}
  .streak-card .lbl{font-size:11.5px;color:var(--ink-dim);font-weight:700;margin-top:2px;}

  .mini-stat{background:var(--surface);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);min-width:0;}
  .mini-stat .lbl{font-size:11px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .mini-stat .val{font-size:18px;font-weight:800;margin-top:2px;overflow-wrap:break-word;}

  .partner-strip{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px;}
  .partner-strip .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .dot-yes{background:var(--accent);}
  .dot-no{background:var(--bad);}

  /* ---------- today sections ---------- */
  .weight-input-row{display:flex;gap:10px;align-items:flex-end;}
  .weight-input-row .field{flex:1;margin-bottom:0;min-width:0;}

  .water-row{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0;}
  .water-row .glasses{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:200px;}
  .glass{width:18px;height:22px;border:2px solid var(--accent);border-top:none;border-radius:0 0 5px 5px;background:transparent;flex:none;}
  .glass.filled{background:var(--accent);}
  .stepbtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent-soft);color:var(--accent-strong);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
  .stepbtn:active{background:var(--accent);color:#fff;}

  .list-item{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;background:var(--surface);}
  .list-item .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0;}
  .list-item .top-row > div:first-child{min-width:0;}
  .list-item .meta{font-size:12px;color:var(--ink-dim);margin-top:2px;overflow-wrap:break-word;}
  .list-item img.photo{width:100%;border-radius:var(--radius-sm);margin-top:8px;max-height:160px;object-fit:cover;}
  .meal-form, .exercise-form{background:var(--surface-2);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;}
  .estimate-box{background:var(--gold-soft);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px;font-size:13px;}
  .estimate-box .mid{font-size:17px;font-weight:800;color:#8a6420;}
  .file-drop{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;font-size:13px;color:var(--ink-dim);background:var(--surface);}

  /* ---------- progress / together charts ---------- */
  .chart-wrap{position:relative;height:180px;margin-top:8px;width:100%;}
  .legend-row{display:flex;gap:14px;font-size:12px;color:var(--ink-dim);margin-top:8px;flex-wrap:wrap;}
  .legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;}

  /* ---------- shared: notes / songs / wishlist / feed ---------- */
  .sticky-note{
    background:var(--gold-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;
    box-shadow:0 4px 10px -6px rgba(44,42,34,0.25);
  }
  .sticky-note.from-me{background:var(--accent-soft);}
  .sticky-note .txt{font-size:14.5px;font-weight:700;overflow-wrap:break-word;}
  .sticky-note .meta{font-size:11px;color:var(--ink-dim);margin-top:6px;}
  .reactions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .reactions button{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 8px;font-size:13px;display:flex;gap:4px;align-items:center;}
  .reactions button .c{font-size:11px;color:var(--ink-dim);font-weight:700;}

  .song-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .song-card .note{font-size:12.5px;color:var(--ink-dim);overflow-wrap:break-word;}
  .song-card > div{min-width:0;}
  .song-emoji{font-size:22px;flex:none;}

  .wishlist-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .wishlist-row:last-child{border-bottom:none;}
  .wishlist-row .check{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
  .wishlist-row .check.done{background:var(--accent);}
  .wishlist-row .txt{flex:1;font-size:14.5px;min-width:0;overflow-wrap:break-word;}
  .wishlist-row .txt.done{text-decoration:line-through;color:var(--ink-dim);}

  .feed-row{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;font-size:13.5px;flex-wrap:wrap;}
  .feed-row .t{font-size:11px;color:var(--ink-dim);white-space:nowrap;margin-left:auto;padding-top:1px;}

  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:999px;margin-bottom:16px;overflow-x:auto;}
  .tabs button{border:none;background:transparent;padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--ink-dim);white-space:nowrap;flex:none;}
  .tabs button.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow);}

  /* ---------- lightweight list rows (not cards) — settings, feature entries ---------- */
  .settings-list, .feature-list{display:flex;flex-direction:column;}
  .settings-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 2px;border-bottom:1px solid var(--border);font-size:14.5px;font-weight:700;
    background:none;border-left:none;border-right:none;border-top:none;color:var(--text);text-align:left;width:100%;
  }
  .settings-list .settings-row:last-child{border-bottom:none;}
  .settings-row .chev{color:var(--text-muted);flex:none;}
  .settings-row:active{background:var(--surface-soft);}

  .feature-row{
    display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border);
    background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%;color:var(--text);
  }
  .feature-list .feature-row:last-child{border-bottom:none;}
  .feature-row .ico{width:36px;height:36px;border-radius:11px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .feature-row .body{flex:1;min-width:0;}
  .feature-row .title{font-weight:800;font-size:14px;display:block;}
  .feature-row .desc{font-size:11.5px;color:var(--text-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .feature-row .chev{color:var(--text-muted);flex:none;}
  .feature-row:active{background:var(--surface-soft);}

  /* ---------- simple label/value rows for compact summaries ---------- */
  .kv-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:13.5px;}
  .kv-row .k{color:var(--text-muted);min-width:0;}
  .kv-row .v{font-weight:800;flex:none;}

  /* ---------- theme preview cards ---------- */
  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .theme-card{background:var(--surface);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);border:2px solid transparent;text-align:left;width:100%;}
  .theme-card.active{border-color:var(--primary);}
  .theme-card .emoji{font-size:22px;line-height:1;}
  .theme-card .name{font-weight:800;font-size:13px;margin-top:7px;line-height:1.25;}
  .theme-card .sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .theme-card .swatches{display:flex;gap:5px;margin-top:9px;}
  .theme-card .sw{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);flex:none;}
  .theme-card .active-badge{margin-top:8px;font-size:11px;font-weight:800;color:var(--primary-hover);}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,18,14,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .modal-overlay[hidden]{display:none;}
  .modal-box{background:var(--surface);border-radius:var(--radius-lg);padding:20px;max-width:340px;width:100%;box-shadow:var(--shadow);}
  .modal-box h3{margin:0 0 8px;font-size:16px;}
  .modal-box p{margin:0 0 16px;font-size:13.5px;color:var(--text-muted);}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{padding:12px 14px;font-size:13.5px;min-height:44px;}

  /* ---------- onboarding ---------- */
  .onboard-wrap{padding:40px 22px 40px;text-align:center;}
  .onboard-wrap .logo{font-size:38px;margin-bottom:6px;}
  .onboard-wrap h1{font-size:24px;margin:0 0 6px;}
  .onboard-wrap p.lede{color:var(--ink-dim);font-size:13.5px;margin:0 0 24px;}
  .onboard-card{text-align:left;}

  .add-toggle-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:var(--radius-md);border:1.5px dashed var(--border);background:transparent;color:var(--accent-strong);font-weight:800;font-size:13.5px;margin-bottom:14px;}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  ::-webkit-scrollbar{display:none;}

  /* =========================================================================
     THEMES — each block only redefines the EXISTING custom properties
     already threaded through every rule above. The `default` theme (no
     data-theme attribute, or data-theme="default") is the :root block
     above, byte-for-byte unchanged.
     ========================================================================= */
  [data-theme="cloud"]{
    --bg:#F4F8FB;
    --surface:#FFFFFF;
    --surface-2:#E5F0F7;
    --ink:#33434C;
    --ink-dim:#7D8C96;
    --accent:#79AFC8;
    --accent-strong:#5C93AD;
    --accent-soft:#DCECF4;
    --gold:#e0a857;
    --gold-soft:#f2e6d3;
    --bad:#d98a76;
    --bad-soft:#f5ded6;
    --border:rgba(51,67,76,0.14);
  }
  [data-theme="witchy"]{
    --bg:#F4EFF7;
    --surface:#FBF8FC;
    --surface-2:#EEE4F0;
    --ink:#382E3D;
    --ink-dim:#87788B;
    --accent:#77558C;
    --accent-strong:#5E426F;
    --accent-soft:#E5D9EA;
    --gold:#9c7a53;
    --gold-soft:#ece1d1;
    --bad:#a9605f;
    --bad-soft:#f0dcda;
    --border:rgba(56,46,61,0.14);
  }
  [data-theme="frog-royalty"]{

/* MET (metabolik eşdeğer) tablosu — egzersizde yakılan tahmini kaloriyi
   hesaplamak için: kcal = MET * kilo(kg) * süre(saat). Kişinin kendi
   kilosuyla hesaplanır, bu bilgi asla partnere gönderilmez. */
const MET_BY_TYPE = { 'Yürüyüş': 3.5, 'Pilates': 3.0, 'Spor Salonu': 5.0, 'Koşu': 9.8, 'Bisiklet': 7.5, 'Yoga': 2.5, 'Diğer': 4.0 };
function estimateExerciseKcal(type, durationMin, weightKg) {
  const met = MET_BY_TYPE[type] != null ? MET_BY_TYPE[type] : MET_BY_TYPE['Diğer'];
  const w = typeof weightKg === 'number' && weightKg > 0 ? weightKg : 70;
  const kcal = met * w * (Math.max(0, durationMin || 0) / 60);
  return Math.round(kcal / 5) * 5;
}

/* Basit, ücretsiz "Estimate AI": açıklama metnindeki yaygın Türkçe yiyecek
   kelimelerini, varsa gram/ml/litre cinsinden miktarı tanıyıp gerçek beslenme
   değerlerine (100g/100ml başına kcal) dayalı olarak hesaplar. Gerçek bir AI
   değildir ama anahtar/maliyet gerektirmez ve önceki sürümden çok daha isabetlidir. */
const FOOD_DB = {
  // içecekler — per100: 100 ml başına kcal, serving: miktar belirtilmezse varsayılan bardak/kutu (ml)
  'portakal suyu': { per100: 45, serving: 200 }, 'elma suyu': { per100: 46, serving: 200 },
  'vişne suyu': { per100: 55, serving: 200 }, 'nar suyu': { per100: 55, serving: 200 },
  'meyve suyu': { per100: 45, serving: 200 }, 'sütlü kahve': { per100: 45, serving: 200 },
  'türk kahvesi': { per100: 8, serving: 60 }, 'filtre kahve': { per100: 2, serving: 200 },
  'yeşil çay': { per100: 1, serving: 200 }, 'bitki çayı': { per100: 1, serving: 200 },
  'su': { per100: 0, serving: 200 }, 'maden suyu': { per100: 0, serving: 200 },
  'soda': { per100: 2, serving: 200 }, 'ayran': { per100: 34, serving: 200 },
  'süt': { per100: 61, serving: 200 }, 'limonata': { per100: 40, serving: 200 },
  'smoothie': { per100: 60, serving: 300 }, 'kola': { per100: 42, serving: 330 },
  'gazoz': { per100: 40, serving: 330 }, 'çay': { per100: 1, serving: 200 },
  'kahve': { per100: 5, serving: 150 }, 'latte': { per100: 55, serving: 240 },
  'cappuccino': { per100: 40, serving: 200 },
  // katı yiyecekler — per100: 100 g başına kcal, serving: tipik 1 porsiyon gramajı
  'yumurta': { per100: 155, serving: 55 }, 'ekmek': { per100: 265, serving: 30 },
  'tost': { per100: 290, serving: 110 }, 'simit': { per100: 275, serving: 110 },
  'peynir': { per100: 300, serving: 30 }, 'zeytin': { per100: 145, serving: 15 },
  'tavuk': { per100: 165, serving: 130 }, 'köfte': { per100: 250, serving: 100 },
  'balık': { per100: 140, serving: 150 }, 'somon': { per100: 208, serving: 130 },
  'et': { per100: 250, serving: 120 }, 'pilav': { per100: 130, serving: 150 },
  'bulgur': { per100: 115, serving: 150 }, 'makarna': { per100: 150, serving: 150 },
  'mercimek': { per100: 116, serving: 150 }, 'çorba': { per100: 55, serving: 250 },
  'salata': { per100: 40, serving: 150 }, 'sebze': { per100: 60, serving: 150 },
  'patates': { per100: 87, serving: 150 }, 'yoğurt': { per100: 61, serving: 150 },
  'muz': { per100: 89, serving: 100 }, 'elma': { per100: 52, serving: 150 },
  'meyve': { per100: 55, serving: 130 }, 'kuruyemiş': { per100: 600, serving: 30 },
  'badem': { per100: 575, serving: 30 }, 'çikolata': { per100: 545, serving: 30 },
  'kek': { per100: 350, serving: 90 }, 'baklava': { per100: 430, serving: 70 },
  'kurabiye': { per100: 480, serving: 30 }, 'menemen': { per100: 120, serving: 200 },
  'omlet': { per100: 155, serving: 150 }, 'granola': { per100: 470, serving: 40 },
  'yulaf': { per100: 375, serving: 40 }, 'reçel': { per100: 260, serving: 15 },
  'bal': { per100: 305, serving: 15 }, 'cips': { per100: 540, serving: 40 },
  'pizza': { per100: 266, serving: 120 }, 'hamburger': { per100: 295, serving: 220 },
  'döner': { per100: 210, serving: 220 },
};
/* Anahtarları önce kelime sayısına (çok kelimeli ifadeler önce, ör. "portakal suyu"
   tek başına "portakal"dan önce denensin), sonra uzunluğa göre sırala. Bu, "portakal
   suyu" yazınca hem "portakal" hem "su" olarak çift sayılmasını engeller. */
const FOOD_DB_KEYS = Object.keys(FOOD_DB).sort((a, b) => {
  const wa = a.split(' ').length, wb = b.split(' ').length;
  return wb !== wa ? wb - wa : b.length - a.length;
});
const QTY_UNIT_RE = 'kilogram|kilo|kg|gram|gr|g|mililitre|ml|santilitre|cl|litre|lt|l|adet|dilim|bardak|tane|porsiyon|kase|kutu|şişe';
/* Bir miktar ifadesini ("330 ml", "1 bardak", "yarım", "2", vb.) o besinin varsayılan
   porsiyon gramajına göre gerçek grama/ml'ye çevirir. */
function parseQtyToGrams(qtyRaw, defaultServing) {
  const q = (qtyRaw || '').trim();
  if (!q) return defaultServing;
  if (/^yarım/i.test(q)) return defaultServing * 0.5;
  const wu = q.match(/(\d+(?:[.,]\d+)?)\s*(kilogram|kilo|kg|gram|gr|g|mililitre|ml|santilitre|cl|litre|lt|l)\b/i);
  if (wu) {
    let n = parseFloat(wu[1].replace(',', '.'));
    const u = wu[2].toLowerCase();
    if (/^(kilogram|kilo|kg)$/.test(u)) n *= 1000;
    else if (/^(litre|lt|l)$/.test(u)) n *= 1000;
    else if (/^(cl|santilitre)$/.test(u)) n *= 10;
    return n; // g/gr/g/mililitre/ml zaten 1:1
  }
  const num = q.match(/\d+(?:[.,]\d+)?/);
  const count = num ? parseFloat(num[0].replace(',', '.')) : 1;
  return defaultServing * count;
}
function estimateCalories(desc) {
  const raw = (desc || '').toLowerCase().trim();
  if (!raw) return { mid: 0, low: 0, high: 0, detected: 'Açıklama boş.' };

  // 1) Kullanıcı doğrudan kalori yazdıysa ("120 kcal", "150 kalori") onu birebir kullan —
  //    kelime tanımaya hiç gerek yok, en isabetli tahmin zaten kullanıcının kendi rakamı.
  const explicit = raw.match(/(\d+(?:[.,]\d+)?)\s*(kcal|kalori)\b/);
  if (explicit) {
    const val = Math.round(parseFloat(explicit[1].replace(',', '.')));
    return { mid: val, low: val, high: val, detected: 'Belirttiğin kalori doğrudan kullanıldı.' };
  }

  let work = ' ' + raw + ' ';
  const found = [];
  let total = 0;
  FOOD_DB_KEYS.forEach(word => {
    const info = FOOD_DB[word];
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // isteğe bağlı miktar hem önden ("330 ml portakal suyu") hem arkadan
    // ("portakal suyu 330 ml", "Pfanner portakal suyu 330 ml") yakalanır.
    const re = new RegExp('(\\d+(?:[.,]\\d+)?\\s*(?:' + QTY_UNIT_RE + ')?\\s*|yarım\\s+)?(' + escaped + ')\\w*(\\s+\\d+(?:[.,]\\d+)?\\s*(?:' + QTY_UNIT_RE + '))?', 'i');
    let m;
    while ((m = work.match(re))) {
      const prefixQty = (m[1] || '').trim();
      const suffixQty = (m[3] || '').trim();
      const qtyRaw = prefixQty || suffixQty;
      const grams = parseQtyToGrams(qtyRaw, info.serving);
      const kcal = info.per100 * grams / 100;
      total += kcal;
      found.push(qtyRaw ? `${qtyRaw} ${word}` : word);
      // Eşleşen kısmı boşlukla değiştir ki aynı bölge başka bir kelimeyle tekrar eşleşmesin.
      work = work.slice(0, m.index) + ' '.repeat(m[0].length) + work.slice(m.index + m[0].length);
    }
  });
  if (found.length) {
    const mid = Math.max(0, Math.round(total / 5) * 5);
    const spread = Math.max(10, Math.round(mid * 0.08));
    return {
      mid, low: Math.max(0, mid - spread), high: mid + spread,
      detected: 'Algılanan: ' + found.join(', '),
    };
  }
  // Tanınan bir kelime yoksa: rastgele büyük bir sayı yerine, makul bir ortalama
  // porsiyon aralığında (150-320 kcal) deterministik bir tahmine düş.
  let hash = 0;
  for (let i = 0; i < raw.length; i++) hash = (hash * 31 + raw.charCodeAt(i)) >>> 0;
  const mid = 150 + (hash % 170);
  const spread = 25 + (hash % 25);
  return {
    mid: Math.round(mid / 10) * 10, low: Math.round((mid - spread) / 10) * 10, high: Math.round((mid + spread) / 10) * 10,
    detected: 'Açıklamanı tam tanıyamadım, ortalama bir porsiyon varsayıldı. İstersen "120 kcal" gibi kaloriyi kendin de yazabilirsin.',
  };
}

/* ---------- paketli ürün araması (Open Food Facts, ücretsiz/anahtarsız) ----------
   Sadece açıklamada gram/ml/litre gibi somut bir miktar varsa denenir (ör. "Pfanner
   portakal suyu 330 ml") — yani markalı, paketli bir ürün olduğu belli olduğunda.
   En fazla 1.5 saniye beklenir; bulunamaz/zaman aşımına uğrarsa sessizce yerel
   tahmine (estimateCalories) düşülür, kullanıcı asla 2 saniyeden uzun beklemez. */
async function lookupPackagedProduct(desc, timeoutMs) {
  if (typeof fetch !== 'function') return null;
  const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
  try {
    const queryText = desc.replace(new RegExp('\\d+(?:[.,]\\d+)?\\s*(?:' + QTY_UNIT_RE + ')\\b', 'gi'), '').trim();
    if (!queryText) return null;
    const url = 'https://world.openfoodfacts.org/cgi/search.pl?json=1&page_size=5&search_terms=' + encodeURIComponent(queryText);
    const res = await fetch(url, controller ? { signal: controller.signal } : {});
    if (!res.ok) return null;
    const data = await res.json();
    const products = (data && data.products) || [];
    const qWords = queryText.toLowerCase().split(/\s+/).filter(Boolean);
    let best = null, bestScore = 0;
    products.forEach(p => {
      const name = ((p.product_name || '') + ' ' + (p.brands || '')).toLowerCase();
      const score = qWords.reduce((acc, w) => acc + (name.includes(w) ? 1 : 0), 0);
      const per100 = p.nutriments && (p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal_100ml']);
      if (per100 && score > bestScore) { bestScore = score; best = { name: p.product_name || queryText, per100 }; }
    });
    if (best && bestScore >= Math.max(1, Math.ceil(qWords.length / 2))) return best;
    return null;
  } catch (e) {
    return null; // ağ yok / zaman aşımı / CORS — sessizce yerel tahmine düş
  } finally {
    if (timer) clearTimeout(timer);
  }
}
/* Meal/Exercise formundaki "Estimate AI" butonunun çağırdığı ana fonksiyon: önce
   yerel (anlık) tahmini hazırlar; açıklamada somut bir gramaj/hacim varsa arka
   planda gerçek ürün veritabanını da dener ve varsa onunla değiştirir. */
async function estimateCaloriesSmart(desc) {
  const raw = (desc || '').trim();
  const local = estimateCalories(raw);
  if (/\d+(?:[.,]\d+)?\s*(kcal|kalori)\b/i.test(raw.toLowerCase())) return local; // kullanıcı zaten net kalori yazmış
  const hasPackagedQty = new RegExp('\\d+(?:[.,]\\d+)?\\s*(?:' + QTY_UNIT_RE.split('|').filter(u => ['kilogram', 'kilo', 'kg', 'gram', 'gr', 'g', 'mililitre', 'ml', 'santilitre', 'cl', 'litre', 'lt', 'l'].includes(u)).join('|') + ')\\b', 'i').test(raw.toLowerCase());
  if (!hasPackagedQty) return local;
  const qtyMatch = raw.toLowerCase().match(/\d+(?:[.,]\d+)?\s*(?:kilogram|kilo|kg|gram|gr|g|mililitre|ml|santilitre|cl|litre|lt|l)\b/i);
  const requestedGrams = qtyMatch ? parseQtyToGrams(qtyMatch[0], 100) : null;
  const remote = await lookupPackagedProduct(raw, 1500);
  if (remote && requestedGrams) {
    const mid = Math.max(0, Math.round((remote.per100 * requestedGrams / 100) / 5) * 5);
    return { mid, low: Math.max(0, mid - 15), high: mid + 15, detected: `Ürün veritabanında bulundu: ${remote.name} (${Math.round(requestedGrams)} g/ml için).` };
  }
  return local;
}

/* ---------------------------------------------------------------------
   2. DATE / FORMAT HELPERS
   --------------------------------------------------------------------- */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function keyMinusDays(key, n) { const d = keyToDate(key); d.setDate(d.getDate() - n); return dateKey(d); }
function keyToDate(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
const MONTHS_TR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const DAYS_TR = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
function fmtShort(key) { const d = keyToDate(key); return d.getDate() + ' ' + MONTHS_TR[d.getMonth()]; }
function fmtLong(key) { const d = keyToDate(key); return DAYS_TR[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_TR[d.getMonth()]; }
function daysBetween(keyA, keyB) { return Math.round((keyToDate(keyB) - keyToDate(keyA)) / 86400000); }
function relativeDays(key) {
  if (!key) return '—';
  const diff = daysBetween(key, todayKey());
  if (diff === 0) return 'Bugün';
  if (diff === 1) return '1 gün önce';
  return diff + ' gün önce';
}
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

/* ---------------------------------------------------------------------
   3. STATE SHAPE / LOCAL DEMO SEEDING
   (Only used in 'local' mode — the remote backend has its own copy of
   this same shape server-side, see lib/domain.js.)

}

function seedDemoState() {

  s.onboarded.B = true;
  s.users.A.setup = { startWeight: 78.4, goalWeight: 70, targetDate: keyMinusDays(todayKey(), -60), waterGoal: 8, exerciseGoal: 4, startDate: keyMinusDays(todayKey(), 8) };
  s.users.B.setup = { startWeight: 65.2, goalWeight: 60, targetDate: keyMinusDays(todayKey(), -45), waterGoal: 8, exerciseGoal: 3, startDate: keyMinusDays(todayKey(), 8) };

  const mealBank = {
    'Kahvaltı': ['Yulaf ezmesi + muz', 'Menemen', 'Yoğurt + granola', 'Peynirli tost'],
    'Öğle Yemeği': ['Tavuklu salata + ayran', 'Mercimek çorbası + salata', 'Izgara tavuk + bulgur', 'Ton balıklı salata'],

  };

  ['A', 'B'].forEach((uKey, uIdx) => {

      const key = keyMinusDays(todayKey(), i);

      }
      if (i === 3) day.note = uKey === 'A' ? 'Bugün kendimi çok iyi hissettim.' : 'Biraz yorgundum ama devam.';
      user.days[key] = day;
    }
    if (uKey === 'A') {
      const today = blankDay();

  s.shared.notes = [
    { id: uid(), author: 'A', text: 'Bugün yürüyüş? 🌿', ts: Date.now() - 3600e3 * 20, reactions: { '❤️': 1, '😂': 0, '🔥': 0, '🌱': 1 } },

  ];

    { id: uid(), author: 'B', song: 'Sunday Morning', artist: 'Maroon 5', note: 'Kahve eşliğinde dinle ☕', ts: Date.now() - 3600e3 * 30 },
    { id: uid(), author: 'A', song: 'Islands', artist: 'The xx', note: '', ts: Date.now() - 3600e3 * 6 },
  ];
  s.shared.wishlist = [
    { id: uid(), text: 'Hafta sonu gezisi', done: false, addedBy: 'A' },

/* ---------------------------------------------------------------------
   4. DOMAIN LOGIC (pure functions over state — identical to the server's
   lib/domain.js on purpose, so local demo mode and remote mode behave
   the same way).
   --------------------------------------------------------------------- */
function otherOf(u) { return u === 'A' ? 'B' : 'A'; }
function getUser(s, u) { return s.users[u]; }
function ensureDay(user, key) { if (!user.days[key]) user.days[key] = blankDay(); return user.days[key]; }
function sortedDayKeys(user) { return Object.keys(user.days).sort(); }

function computeStreak(user) {
  let streak = 0;
  let key = todayKey();
  if (!user.days[key] || !user.days[key].checkin) key = keyMinusDays(key, 1);
  else { streak++; key = keyMinusDays(key, 1); }
  let guard = 0;
  while (user.days[key] && user.days[key].checkin && guard < 3650) { streak++; key = keyMinusDays(key, 1); guard++; }
  return streak;
}
function computeTogetherStreak(s) {
  let streak = 0;
  let key = todayKey();
  const bothToday = s.users.A.days[key] && s.users.A.days[key].checkin && s.users.B.days[key] && s.users.B.days[key].checkin;
  key = keyMinusDays(key, 1);
  if (bothToday) streak++;
  let guard = 0;
  while (guard < 3650) {
    const a = s.users.A.days[key], b = s.users.B.days[key];
    if (a && a.checkin && b && b.checkin) { streak++; key = keyMinusDays(key, 1); guard++; } else break;
  }
  return streak;
}
function latestWeightEntry(user) {
  const keys = sortedDayKeys(user).filter(k => typeof user.days[k].weight === 'number');
  if (!keys.length) return null;
  const k = keys[keys.length - 1];
  return { key: k, weight: user.days[k].weight };
}
function currentWeight(user) { const e = latestWeightEntry(user); return e ? e.weight : user.setup.startWeight; }
function totalChange(user) {
  const cw = currentWeight(user);
  if (cw == null || user.setup.startWeight == null) return null;
  return +(cw - user.setup.startWeight).toFixed(1);
}
function goalProgressPct(user) {
  const total = user.setup.startWeight - user.setup.goalWeight;
  if (!total || total <= 0) return 0;
  const done = user.setup.startWeight - currentWeight(user);
  return Math.max(0, Math.min(100, (done / total) * 100));
}
function changeFromStartSeries(user, days) {
  const out = [];
  let lastKnown = user.setup.startWeight;
  let lastKnownKey = user.setup.startDate;
  for (let i = days - 1; i >= 0; i--) {
    const key = keyMinusDays(todayKey(), i);
    const day = user.days[key];
    let carried = false;
    if (day && typeof day.weight === 'number') { lastKnown = day.weight; lastKnownKey = key; }
    else carried = key !== user.setup.startDate;
    out.push({ key, value: user.setup.startWeight == null || lastKnown == null ? 0 : +(lastKnown - user.setup.startWeight).toFixed(2), isCarried: carried, lastKnownKey });
  }
  return out;
}
function weightTrendSeries(user) {
  return sortedDayKeys(user).filter(k => typeof user.days[k].weight === 'number').map(k => ({ key: k, weight: user.days[k].weight }));
}
function todayMealCount(user) { const d = user.days[todayKey()]; return d ? d.meals.length : 0; }
function todayExerciseDone(user) { const d = user.days[todayKey()]; return !!(d && d.exercises.length); }
function todayWater(user) { const d = user.days[todayKey()]; return d ? d.water : 0; }
function todayCheckin(user) { const d = user.days[todayKey()]; return !!(d && d.checkin); }
function logActivity(s, icon, text) { s.shared.activity.unshift({ id: uid(), icon, text, ts: Date.now() }); s.shared.activity = s.shared.activity.slice(0, 40); }
function markCheckin(s, uKey) {
  const user = s.users[uKey];
  const day = ensureDay(user, todayKey());
  const wasCheckedIn = day.checkin;
  day.checkin = true;
  if (!wasCheckedIn) {
    logActivity(s, '🌱', `${user.name} bugün check-in yaptı`);
    const other = s.users[otherOf(uKey)];
    if (other.days[todayKey()] && other.days[todayKey()].checkin) {
      const t = computeTogetherStreak(s);
      if (t > 0) logActivity(s, '🔥', `Birlikte seri ${t} güne ulaştı`);
    }
  }
}
/* Real, non-fabricated weekly summary — only counts what user.days already
   records. Week = Monday..today (never invents future days). */
function startOfWeekKey(key) {
  const d = keyToDate(key);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = dow === 0 ? 6 : dow - 1;
  d.setDate(d.getDate() - diff);
  return dateKey(d);
}
function thisWeekKeys() {
  const start = startOfWeekKey(todayKey());
  const out = [];
  for (let i = 0; i < 7; i++) {
    const k = keyMinusDays(start, -i);
    if (k <= todayKey()) out.push(k);
  }
  return out;
}
function weeklySummary(user) {
  const keys = thisWeekKeys();
  let checkinDays = 0, waterMet = 0, exerciseCount = 0, mealCount = 0;
  keys.forEach(k => {
    const d = user.days[k];
    if (!d) return;
    if (d.checkin) checkinDays++;
    if (d.water >= user.setup.waterGoal) waterMet++;
    exerciseCount += d.exercises.length;
    mealCount += d.meals.length;
  });
  return { checkinDays, waterMet, exerciseCount, mealCount, totalDays: keys.length };
}
/** Partner-facing computed fields — same shape whether they come from the
 *  server (remote mode) or are computed locally (local demo mode). Never
 *  reads raw weight numbers for anyone but the current user. */
function getPartnerMeta(s, other) {
  if (Store.mode() === 'remote') {
    return { totalChange: other._totalChange, changeSeries: other._changeSeries || [], lastUpdateKey: other._lastUpdateKey };
  }
  return { totalChange: totalChange(other), changeSeries: changeFromStartSeries(other, 10), lastUpdateKey: sortedDayKeys(other).pop() || null };
}
function getSeriesForRole(s, role) {
  if (role === s.currentUser) return changeFromStartSeries(getUser(s, role), 10);
  return getPartnerMeta(s, getUser(s, role)).changeSeries;
}

/* ---------------------------------------------------------------------
   5. STORE — local demo (localStorage) + remote (fetch) in one module.
   Everything else in this file calls Store.get()/Store.mode()/runChange().
   --------------------------------------------------------------------- */
const Store = (function () {
  let mode = null; // 'local' | 'remote' | 'gate'
  let state = null;
  let token = null;

  function loadLocal() { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { } }

  function readTokenFromUrlOrStorage() {
    try {
      const url = new URL(window.location.href);
      const fromUrl = url.searchParams.get('u');
      if (fromUrl) {
        localStorage.setItem(TOKEN_KEY, fromUrl);
        url.searchParams.delete('u');
        const clean = url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '');
        window.history.replaceState({}, '', clean);
      }
    } catch (e) { /* ignore */ }
    try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }

  function applyRemoteResponse(data) {
    if (!state) state = { currentUser: null, onboarded: { A: false, B: false }, users: { A: null, B: null }, shared: null };
    state.currentUser = data.role;
    state.onboarded[data.role] = data.onboarded;
    state.users[data.role] = data.me;
    const other = otherOf(data.role);
    state.onboarded[other] = data.partner.onboarded;
    const key = todayKey();
    const days = {};
    days[key] = {
      checkin: data.partner.today.checkin, weight: null, water: data.partner.today.water,
      meals: new Array(data.partner.today.mealsCount).fill(null).map(() => ({})),
      exercises: data.partner.today.exerciseDone ? [{}] : [], note: ''
    };
    state.users[other] = {
      name: data.partner.name,
      setup: { startWeight: null, goalWeight: null, waterGoal: data.partner.waterGoal, exerciseGoal: data.partner.exerciseGoal, targetDate: null, startDate: null },
      days,
      _totalChange: data.partner.totalChange,
      _changeSeries: data.partner.changeSeries,
      _lastUpdateKey: data.partner.lastUpdateKey,
    };
    state.shared = data.shared;
  }

  async function tryRemoteInit() {
    token = readTokenFromUrlOrStorage();
    if (!token) return false;
    try {
      const res = await fetch('/api/state', { headers: { Authorization: 'Bearer ' + token } });
      if (res.status === 401) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) { } token = null; App.gateError = 'Kod geçersiz görünüyor. Tekrar dene.'; return false; }
      if (!res.ok) return false;
      applyRemoteResponse(await res.json());
      mode = 'remote';
      return true;
    } catch (e) {
      return false; // no network / no backend deployed yet
    }
  }

  async function dispatch(type, payload) {
    const res = await fetch('/api/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ type, payload: payload || {} })
    });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.message || j.error || msg; } catch (e) { }
      throw new Error(msg);
    }
    applyRemoteResponse(await res.json());
    return state;
  }

  return {
    async init() {
      // Opened straight from disk (double-clicked the file) -> no server can
      // exist, so skip straight to the local demo mode.
      if (location.protocol === 'file:') {
        mode = 'local';
        state = loadLocal() || seedDemoState();
        saveLocal();
        return state;
      }
      // Served over http(s) — either a real deployment or `npm run dev` —
      // always go through the real access-token flow.
      const ok = await tryRemoteInit();
      if (ok) return state;
      mode = 'gate';
      return null;
    },
    async tryRemoteInitPublic() { return tryRemoteInit(); },
    mode() { return mode; },
    get() { return state; },
    update(mutator) { mutator(state); if (mode === 'local') saveLocal(); },
    async dispatch(type, payload) { return dispatch(type, payload); },
    reset() { state = seedDemoState(); saveLocal(); return state; },
    hardReset() { state = blankState(); saveLocal(); return state; },
    setGateError(msg) { App.gateError = msg; },
    logout() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) { } location.reload(); },
  };
})();

/** Runs a change either via the server (remote) or directly on local state
 *  (local demo). Every click handler in this file goes through this so the
 *  two modes share one code path. */
async function runChange(localMutator, type, payload) {
  if (Store.mode() === 'remote') {
    await Store.dispatch(type, payload);
  } else {
    Store.update(localMutator);
  }
}

   6. TOAST / MODAL

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);

/** Generic in-app confirm/alert modal — used instead of window.confirm() so
 *  the copy and buttons are fully controlled and consistently styled.
 *  opts = { title, body, buttons: [{ label, cls, danger, onClick }] } */
function openModal(opts) {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <h3>${esc(opts.title)}</h3>
    <p>${esc(opts.body)}</p>

      ${opts.buttons.map((b, i) => `<button class="btn ${b.cls || 'btn-outline'}" data-mbtn="${i}" style="${b.danger ? 'background:var(--danger);color:#fff;' : ''}">${esc(b.label)}</button>`).join('')}
    </div>`;
  overlay.hidden = false;
  opts.buttons.forEach((b, i) => {
    const btn = box.querySelector(`[data-mbtn="${i}"]`);
    if (btn) btn.addEventListener('click', b.onClick);
  });
}
function closeModal() {
  document.getElementById('modal-overlay').hidden = true;
}

/* ---------------------------------------------------------------------
   7. APP / ROUTER
   App.route is one of the 4 bottom-nav tabs. App.subRoute (nullable) is a
   "detail screen" beneath the current tab (see SUBROUTE_META) — it is
   cleared whenever a main tab is tapped, and reflected into location.hash
   so a refresh or the browser back button doesn't always dump the user
   back to the default tab.
   --------------------------------------------------------------------- */
const App = { route: 'today', subRoute: null, progressRange: '30', charts: {}, gateError: '' };

function pushHash() {
  try {
    const path = App.subRoute ? SUBROUTE_TO_PATH[App.subRoute] : ROUTE_TO_PATH[App.route];
    const newHash = '#/' + path;
    if (location.hash !== newHash) history.pushState(null, '', newHash);
  } catch (e) { /* ignore (e.g. sandboxed iframe) */ }
}
function applyHashToApp() {
  try {
    const h = (location.hash || '').replace(/^#\/?/, '');
    if (!h) return;
    if (PATH_TO_SUBROUTE[h]) {
      const sub = PATH_TO_SUBROUTE[h];
      App.subRoute = sub;
      App.route = SUBROUTE_META[sub].parent;
      return;
    }
    if (PATH_TO_ROUTE[h]) {
      App.route = PATH_TO_ROUTE[h];
      App.subRoute = null;
    }
  } catch (e) { /* ignore */ }
}
function navigateTo(route, subRoute) {
  App.route = route;
  App.subRoute = subRoute || null;
  pushHash();
  render();
}
function goBack() {
  App.subRoute = null;
  pushHash();
  render();
}
window.addEventListener('popstate', () => {
  if (Store.mode() === 'gate' || Store.mode() === null) return;
  const s = Store.get();
  if (!s || !s.onboarded[s.currentUser]) return;
  applyHashToApp();
  render();
});

function applyTheme(theme) {
  try { document.documentElement.setAttribute('data-theme', theme || 'default'); } catch (e) { /* ignore */ }
}

function render() {
  const container = document.getElementById('view-container');
  const navHolder = document.getElementById('bottom-nav-holder');
  const topHolder = document.getElementById('top-bar-holder');

  if (Store.mode() === 'gate') {
    applyTheme('default');
    container.innerHTML = renderGate();
    navHolder.innerHTML = '';
    topHolder.innerHTML = '';
    wireGate();
    return;
  }

  const s = Store.get();
  applyTheme(s.users[s.currentUser] ? s.users[s.currentUser].theme : 'default');

  if (!s.onboarded[s.currentUser]) {
    container.innerHTML = renderOnboarding(s);
    navHolder.innerHTML = '';
    topHolder.innerHTML = '';
    wireOnboarding();
    return;
  }

  navHolder.innerHTML = renderBottomNav();
  wireBottomNav();

  topHolder.innerHTML = renderTopBar(s);
  wireTopBar();

  let html = '';
  if (App.subRoute) {
    html = renderSubRoute(s, App.subRoute);
  } else {
    switch (App.route) {
      case 'today': html = renderToday(s); break;
      case 'progress': html = renderProgress(s); break;
      case 'together': html = renderTogether(s); break;
      case 'profile': html = renderProfileMain(s); break;
      default: html = renderToday(s);
    }
  }
  container.innerHTML = html;
  container.scrollTop = 0;

  if (App.subRoute) {
    wireSubRoute(App.subRoute);
  } else {
    if (App.route === 'today') wireToday();
    if (App.route === 'progress') wireProgress();
    if (App.route === 'together') wireTogetherMain();
    if (App.route === 'profile') wireProfileMain();
  }
}

function renderSubRoute(s, sub) {
  switch (sub) {
    case 'progress-history': return renderProgressHistory(s);
    case 'together-progress': return renderTogetherProgress(s);
    case 'together-notes': return renderSharedNotes(s);
    case 'together-songs': return renderSongs(s);
    case 'together-wishlist': return renderWishlist(s);
    case 'together-feed': return renderActivityFeed(s);
    case 'me-goals': return renderMeGoals(s);
    case 'me-account': return renderMeAccount(s);
    case 'me-data': return renderMeData(s);
    case 'me-appearance': return renderMeAppearance(s);
    default: return '';
  }
}
function wireSubRoute(sub) {
  if (sub === 'progress-history') wireProgressHistory();
  else if (sub === 'together-progress') wireTogetherChart();
  else if (sub === 'together-notes') wireSharedNotes();
  else if (sub === 'together-songs') wireSongs();
  else if (sub === 'together-wishlist') wireWishlist();
  else if (sub === 'me-goals') wireMeGoals();
  else if (sub === 'me-account') wireMeAccount();
  else if (sub === 'me-data') wireMeData();
  else if (sub === 'me-appearance') wireMeAppearance();
  // 'together-feed' has no interactive elements
}

/* ---------------------------------------------------------------------
   8. ACCESS GATE (remote mode only — shown when no valid token yet)
   Renders OUTSIDE the tab/header system entirely — unchanged from before.
   --------------------------------------------------------------------- */
function renderGate() {
  return `
    <div class="onboard-wrap">
      <div class="logo">🌿</div>
      <h1>Together</h1>
      <p class="lede">Bu, ikiniz için özel bir alan. Sana gönderilen erişim linkine tıkla ya da kodunu aşağıya yapıştır.</p>
      <div class="card onboard-card">
        <div class="field"><label for="gate-code">Erişim kodun</label><input id="gate-code" type="text" placeholder="kod..." autocomplete="off"></div>
        <button class="btn btn-primary" id="gate-save">Giriş yap</button>
        <p class="sub" style="text-align:center;margin-top:10px;color:var(--bad);" id="gate-err">${esc(App.gateError || '')}</p>
      </div>
    </div>`;
}
function wireGate() {
  document.getElementById('gate-save').addEventListener('click', async () => {
    const code = document.getElementById('gate-code').value.trim();
    if (!code) return;
    try { localStorage.setItem(TOKEN_KEY, code); } catch (e) { }
    App.gateError = 'Kontrol ediliyor…';
    render();
    const ok = await Store.tryRemoteInitPublic();
    if (ok) { App.gateError = ''; render(); }
    else { App.gateError = 'Kod geçersiz görünüyor. Tekrar dene.'; render(); }
  });
}

/* ---------------------------------------------------------------------
   9. TOP BAR (fixed — rendered into #top-bar-holder, a flex:none sibling
   of #view-container; see the app-shell CSS comment for the mechanism)
   --------------------------------------------------------------------- */
function renderTopBar(s) {
  const isRemote = Store.mode() === 'remote';
  const me = getUser(s, s.currentUser);

  if (App.subRoute) {
    const meta = SUBROUTE_META[App.subRoute];
    return `
      <button class="back-header" id="back-btn">‹ ${esc(meta.parentLabel)}</button>
      <h1>${esc(meta.title)}</h1>`;
  }

  return `
    <div class="top-bar">
      <div>
        <h1>${TITLE_MAP[App.route] || 'Bugün'}</h1>
        ${isRemote
          ? `<div class="sub">Merhaba, <strong>${esc(me.name)}</strong></div>`

  return out;

function wireToday() {

      await runChange(st => { const u = getUser(st, st.currentUser); ensureDay(u, key).weight = val; markCheckin(st, st.currentUser); }, 'SAVE_WEIGHT', { weight: val });
    } catch (e) { toast('Kaydedilemedi: ' + e.message); return; }

  });

  document.getElementById('toggle-meal-form').addEventListener('click', () => {

  });
  document.getElementById('toggle-exercise-form').addEventListener('click', () => {
    const holder = document.getElementById('exercise-form-holder');

    if (holder.innerHTML) wireExerciseForm();
  });

  document.getElementById('meal-list').addEventListener('click', async (e) => {
    const delBtn = e.target.closest('button[data-del-meal]');

    if (delBtn) {
      const id = delBtn.dataset.delMeal;
      try {
        await runChange(st => { const u = getUser(st, st.currentUser); const d = ensureDay(u, key); d.meals = d.meals.filter(m => m.id !== id); }, 'DELETE_MEAL', { id });
      } catch (e) { toast('Silinemedi: ' + e.message); return; }
      render();
      return;
    }
    if (editBtn) {

      const meal = day.meals.find(m => m.id === id);

      holder.innerHTML = renderMealForm(meal);
      wireMealForm(meal);
      holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });

  document.getElementById('exercise-list').addEventListener('click', async (e) => {
    const delBtn = e.target.closest('button[data-del-ex]');
    const editBtn = e.target.closest('button[data-edit-ex]');
    if (delBtn) {
      const id = delBtn.dataset.delEx;
      try {
        await runChange(st => { const u = getUser(st, st.currentUser); const d = ensureDay(u, key); d.exercises = d.exercises.filter(ex => ex.id !== id); }, 'DELETE_EXERCISE', { id });

      holder.innerHTML = renderExerciseForm(ex);

      holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    try {
      await runChange(st => { const u = getUser(st, st.currentUser); const d = ensureDay(u, key); d.water = Math.min(20, d.water + 1); markCheckin(st, st.currentUser); }, 'SET_WATER_DELTA', { delta: 1 });
    } catch (e) { toast('Kaydedilemedi: ' + e.message); return; }
    render();
  });
  document.getElementById('water-minus').addEventListener('click', async () => {
    try {
      await runChange(st => { const u = getUser(st, st.currentUser); const d = ensureDay(u, key); d.water = Math.max(0, d.water - 1); }, 'SET_WATER_DELTA', { delta: -1 });
    } catch (e) { toast('Kaydedilemedi: ' + e.message); return; }
    render();
  });

  document.getElementById('save-note').addEventListener('click', async () => {
    const txt = document.getElementById('daily-note').value;

function wireMealForm(existing) {

  });

  estimateBtn.addEventListener('click', async () => {

    const box = document.getElementById('mf-estimate-box');
    box.innerHTML = '<div class="estimate-box sub">Hesaplanıyor…</div>';

    }
    // Form hâlâ ekrandaysa sonucu göster (kullanıcı bu sırada formu kapatmış olabilir).

  });

    const type = document.getElementById('mf-type').value;
    const time = document.getElementById('mf-time').value;
    const desc = descInput.value.trim();
    if (!desc) { toast('Kısa bir açıklama gir.'); return; }
    const isEdit = !!existing;
    const id = isEdit ? existing.id : uid();
    const payload = isEdit ? { id, type, time, desc, estimate } : { type, time, desc, estimate };
    try {
      await runChange(st => {
        const u = getUser(st, st.currentUser);
        const d = ensureDay(u, todayKey());
        if (isEdit) {
          const m = d.meals.find(m => m.id === id);

          d.meals.push({ id, type, time, desc, estimate });
          markCheckin(st, st.currentUser);

      }, isEdit ? 'EDIT_MEAL' : 'ADD_MEAL', payload);
    } catch (e) { toast('Kaydedilemedi: ' + e.message); return; }

  });

      <div class="section-title">İlerlemem</div>
      <div class="kv-row"><span class="k">Toplam değişim</span><span class="v num">${change == null ? '—' : (change > 0 ? '+' : '') + change + ' kg'}</span></div>
      <div class="kv-row"><span class="k">Hedefe kalan</span><span class="v num">${remain == null ? '—' : Math.abs(remain) + ' kg'}</span></div>
      <div class="kv-row"><span class="k">Son check-in</span><span class="v">${relativeDays(lastCheckinKey)}</span></div>
      <button class="btn-ghost btn-sm" id="me-progress-link" style="margin-top:2px;">Detayları gör →</button>
    </div>

    <div class="card">
      <div class="section-title">Hedeflerim</div>
      <div class="kv-row"><span class="k">Hedef kilo</span><span class="v num">${user.setup.goalWeight != null ? user.setup.goalWeight + ' kg' : '—'}</span></div>
      <div class="kv-row"><span class="k">Günlük su hedefi</span><span class="v num">${user.setup.waterGoal} bardak</span></div>
      <div class="kv-row"><span class="k">Haftalık egzersiz hedefi</span><span class="v num">${user.setup.exerciseGoal} gün</span></div>
      <button class="btn-ghost btn-sm" id="me-goals-link" style="margin-top:2px;">Hedefleri düzenle →</button>
    </div>

    <div class="card">
      <div class="section-title">Ayarlar</div>
      <div class="settings-list">
        <button class="settings-row" data-sub="me-appearance"><span>🎨 Görünüm &amp; Tema</span><span class="chev">›</span></button>
        <button class="settings-row" data-sub="me-goals"><span>🎯 Hedeflerim</span><span class="chev">›</span></button>
        <button class="settings-row" data-sub="me-account"><span>👤 Hesap</span><span class="chev">›</span></button>
        <button class="settings-row" data-sub="me-data"><span>⚠️ Veri Yönetimi</span><span class="chev">›</span></button>
      </div>
    </div>
  `;
}
function wireProfileMain() {
  document.getElementById('me-progress-link').addEventListener('click', () => navigateTo('progress', null));
  document.getElementById('me-goals-link').addEventListener('click', () => navigateTo('profile', 'me-goals'));
  document.querySelectorAll('.settings-row[data-sub]').forEach(btn => {
    btn.addEventListener('click', () => navigateTo('profile', btn.dataset.sub));
  });
}

function renderMeGoals(s) {
  const user = getUser(s, s.currentUser);
  return `
    <div class="card">
      <div class="field"><label>Hedef kilo (kg)</label><input type="number" step="0.1" id="pf-goal" value="${user.setup.goalWeight}"></div>
      <div class="field"><label>Günlük su hedefi</label><input type="number" id="pf-water" value="${user.setup.waterGoal}"></div>
      <div class="field"><label>Haftalık egzersiz hedefi</label><input type="number" id="pf-ex" value="${user.setup.exerciseGoal}"></div>
      <button class="btn btn-primary btn-sm" id="pf-save">Güncelle</button>
    </div>`;
}
function wireMeGoals() {
  document.getElementById('pf-save').addEventListener('click', async () => {
    const goal = parseFloat(document.getElementById('pf-goal').value);
    const water = parseInt(document.getElementById('pf-water').value, 10);
    const ex = parseInt(document.getElementById('pf-ex').value, 10);
    try {
      await runChange(st => { const u = getUser(st, st.currentUser); if (goal) u.setup.goalWeight = goal; if (water) u.setup.waterGoal = water; if (ex) u.setup.exerciseGoal = ex; }, 'UPDATE_GOALS', { goalWeight: goal, waterGoal: water, exerciseGoal: ex });
      toast('Güncellendi.');
    } catch (e) { toast('Kaydedilemedi: ' + e.message); return; }
    render();
  });
}

function renderMeAccount(s) {
  const user = getUser(s, s.currentUser);
  const isRemote = Store.mode() === 'remote';
  if (isRemote) {
    return `
      <div class="card">
        <p class="sub" style="margin-top:0;">Bu link ${esc(user.name)} olarak sana özel. Başkasıyla paylaşma.</p>
        <button class="btn btn-outline btn-sm" id="pf-logout" style="margin-top:10px;">Çıkış yap</button>
      </div>`;
  }
  return `
    <div class="card">
      <p class="sub" style="margin-top:0;">Yerel demo modundasın; erişim linki / hesap kavramı burada geçerli değil. Kullanıcı değiştirmek için üst çubuktaki geçişi kullan.</p>
    </div>`;
}
function wireMeAccount() {
  const logout = document.getElementById('pf-logout');
  if (logout) logout.addEventListener('click', () => Store.logout());
}

function renderMeData(s) {
  const isRemote = Store.mode() === 'remote';
  if (isRemote) {
    return `
      <div class="card">
        <p class="sub" style="margin-top:0;">Kilo, öğün, egzersiz ve check-in geçmişini tamamen siler ve seni tekrar onboarding'e götürür. Bu işlem sadece kendi verini siler, partnerinin verisi etkilenmez. Geri alınamaz.</p>
        <button class="btn btn-outline btn-sm" id="pf-hard-reset" style="margin-top:10px;color:#a3453a;border-color:#a3453a;">Verilerimi Sıfırla</button>
      </div>`;
  }
  return `
    <div class="card">
      <p class="sub" style="margin-top:0;">Bu bir yerel demo modudur; veriler yalnızca bu tarayıcıda, localStorage üzerinde tutulur.</p>
      <button class="btn btn-outline btn-sm" id="pf-reseed" style="margin-bottom:8px;">Demo Verisini Yenile</button>
      <button class="btn btn-outline btn-sm" id="pf-reset">Sıfırla ve Onboarding'i Göster</button>
    </div>`;
}
function wireMeData() {
  const reseed = document.getElementById('pf-reseed');
  if (reseed) reseed.addEventListener('click', () => { Store.reset(); App.route = 'today'; App.subRoute = null; pushHash(); render(); toast('Demo verisi yenilendi.'); });
  const localReset = document.getElementById('pf-reset');
  if (localReset) localReset.addEventListener('click', () => { Store.hardReset(); App.route = 'today'; App.subRoute = null; pushHash(); render(); });

  const remoteReset = document.getElementById('pf-hard-reset');
  if (remoteReset) remoteReset.addEventListener('click', () => {
    openModal({
      title: 'Verilerimi Sıfırla',
      body: 'Bu işlem kilo, öğün, egzersiz ve check-in geçmişini kalıcı olarak silecek. İşlem geri alınamaz.',
      buttons: [
        { label: 'Vazgeç', cls: 'btn-outline', onClick: closeModal },
        {
          label: 'Verilerimi Sıfırla', cls: 'btn-primary', danger: true, onClick: async () => {
            closeModal();
            try {
              await runChange(st => { const u = getUser(st, st.currentUser); st.users[st.currentUser] = blankUser(u.name, null, null); st.onboarded[st.currentUser] = false; }, 'RESET_MY_DATA', {});
            } catch (e) { toast('Sıfırlanamadı: ' + e.message); return; }
            App.route = 'today';
            App.subRoute = null;
            pushHash();
            render();
            toast('Verilerin sıfırlandı.');
          }
        },
      ]
    });
  });
}

function renderMeAppearance(s) {
  const user = getUser(s, s.currentUser);
  const current = user.theme || 'default';
  return `
    <div class="theme-grid">
      ${THEMES.map(t => `
        <button class="theme-card ${current === t.key ? 'active' : ''}" data-theme-key="${t.key}">
          <div class="emoji">${t.emoji}</div>
          <div class="name">${esc(t.name)}</div>
          <div class="sub">${esc(t.subtitle)}</div>
          <div class="swatches">${t.swatches.map(c => `<span class="sw" style="background:${c};"></span>`).join('')}</div>
          ${current === t.key ? '<div class="active-badge">✓ Aktif</div>' : ''}
        </button>`).join('')}
    </div>`;
}
function wireMeAppearance() {
  document.querySelectorAll('.theme-card[data-theme-key]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.dataset.themeKey;
      applyTheme(key); // instant visual feedback before the round-trip resolves
      try {
        await runChange(st => { getUser(st, st.currentUser).theme = key; }, 'SET_THEME', { theme: key });
      } catch (e) { toast('Tema kaydedilemedi: ' + e.message); }
      render();
    });
  });
}

/* ---------------------------------------------------------------------
   16. INIT
   --------------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', async () => {
  await Store.init();
  if (Store.mode() !== 'gate') {
    const s = Store.get();
    if (s && s.onboarded[s.currentUser]) applyHashToApp();
  }
  render();
});

</script>
</body>
</html>
